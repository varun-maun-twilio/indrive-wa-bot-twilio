name: Deploy Twilio Serverless & Studio

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Twilio CLI and SDK will automatically use these environment variables
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      STUDIO_FLOW_SID: ${{ secrets.STUDIO_FLOW_SID }}
      SERVICE_NAME: 'indrive-studio-helper' 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Twilio CLI and Serverless Plugin
        run: |
          npm install -g twilio-cli
          twilio plugins:install @twilio-labs/plugin-serverless

      - name: Install Serverless Dependencies
        working-directory: ./serverless/indrive-studio-helper
        run: npm install

      - name: Create .env file for Serverless
        working-directory: ./serverless/indrive-studio-helper
        run: |
          echo "GOOGLE_SHEET_ENDPOINT=${{ secrets.GOOGLE_SHEETS_ENDPOINT }}" >> .env

      - name: Deploy Twilio Serverless
        working-directory: ./serverless/indrive-studio-helper
        # Deploys the project and overrides existing functions with the same name
        run: twilio serverless:deploy --override-existing-project

      - name: Install Root Dependencies (Twilio SDK for Studio script)
        run: npm install twilio

      - name: Update and Publish Twilio Studio Flow
        run: node studio/deploy-studio.js